spring:
  application:
    name: atom-erp
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:atom_erp}
    username: ${PG_APP_USER:atom_app}
    password: ${PG_APP_PASSWORD:atom_app_local}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  flyway:
    enabled: true
    schemas: core,fac,hrq,eqp,cst,fcd,sal,rpt,qar,dem
    create-schemas: true
    # 모듈별 버전 대역(core V1_x, fac V2_x …). PostGIS 의존 DDL 은 postgis 프로필에서 추가
    locations: classpath:db/migration/core,classpath:db/migration/fac,classpath:db/migration/hrq,classpath:db/migration/eqp,classpath:db/migration/cst,classpath:db/migration/fcd,classpath:db/migration/sal,classpath:db/migration/rpt,classpath:db/migration/qar,classpath:db/migration/dem
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100
  messages:
    basename: messages/core-errors,messages/fac-errors,messages/hrq-errors,messages/eqp-errors,messages/cst-errors,messages/fcd-errors,messages/sal-errors,messages/rpt-errors,messages/qar-errors,messages/dem-errors
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 50MB      # FCD 명세서 업로드 상한(설계 B5.2)
      max-request-size: 51MB
  mvc:
    problemdetails:
      enabled: false   # GlobalProblemHandler 가 대신 처리
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # 자체 outbox 채택, Modulith Event Publication Registry 미사용 (ADR-005)

atom:
  security:
    enabled: true
    issuers:
      - ${KEYCLOAK_URL:http://localhost:8180}/realms/atom-internal
      - ${KEYCLOAK_URL:http://localhost:8180}/realms/atom-portal
  idempotency:
    required-clients: [field-app]
    retention: 24h
    lock-timeout: 30s
  fac:
    due-scan:
      enabled: true
      cron: "0 0 2 * * *"        # 매일 02:00 KST
      thresholds: "180,90,30"
  hrq:
    expiry:
      enabled: true
      cron: "0 0 6 * * *"        # 매일 06:00 KST 만료 스캔
      thresholds: "90,60,30,7"
  eqp:
    calibration-scan:
      enabled: true
      cron: "0 10 0 * * *"       # 매일 00:10 KST — due-soon(D-60/30/7/0) · expired 통합 스캔
      thresholds: "60,30,7,0"
    drone:
      hrq-check: false           # HRQ 조종자 자격 어댑터 연동 전(true 면 Fail-closed 로 비행 등록 보류)
  fcd:
    review:
      k-per-1000: 20        # 월 검토 예산(거래 1,000건당) — 프로토타입 라운드 3 채택값
      min-score: 30
    aip:
      base-url: ${FCD_AIP_URL:}   # Python atomeng_aip.fraud 서비스(비우면 스텁: 맥락 없음 · L3 DISABLED)
      timeout: 800ms
  sal:
    discount-limits:             # BR-SAL-006 역할 · 그룹별 할인 한도(초과 시 EXEC 승인). DB CHECK 가 50% 미만 최종 상한
      "[SALES]": 0.05
      "[SALES_LEAD]": 0.10
      "[EXEC]": 0.49
    estimate-valid-days: 30
    collect-overlap: 10m         # BR-SAL-013 직전 성공 range_to − 10분부터 다시 조회
    initial-lookback: 2d
    collect:
      enabled: ${ATOM_SAL_G2B_COLLECT:false}   # 01-IMPL 배포: stg 7일 검증 후 ON
      cron: "0 0/30 * * * *"
    g2b:                         # ⚠️ 오퍼레이션명 · 파라미터는 공공데이터포털 명세서 확인 후 확정
      base-url: ${G2B_BASE_URL:https://apis.data.go.kr/1230000/ad/BidPublicInfoService}
      service-key: ${G2B_SERVICE_KEY:}
      notice-operation: ${G2B_NOTICE_OP:getBidPblancListInfoServc}
      page-size: 100
      read-timeout: 10s
      max-attempts: 3
  rpt:
    facility-class: BLD_RC        # 상태평가 rule table 기본 시설물 분류(⚠️ 예시 규칙 V6_0_2)
    pdf:
      gotenberg-url: ${GOTENBERG_URL:}   # 비우면 스텁 변환기(합성 PDF, 경고 로그) — 운영은 Gotenberg(LibreOffice+H2Orestart)
      timeout: 10m
  qar:
    ai:
      base-url: ${ATOM_AI_CORE_URL:}     # Atom AI Core = 로컬 vLLM(OpenAI 호환, 예 http://localhost:8080) — 비우면 AI 검토 단계 스킵
      model: ${ATOM_AI_CORE_MODEL:atom-qar-review}
      deadline: 10m                      # NFR-QAR-02 작업 마감(요청 + 10분) → 초과 시 AI_TIMEOUT
      http-timeout: 9m
      auto-start: true                   # 제출 직후 AI_START(AUTO)
    worker:
      enabled: true                      # AI 작업 처리 · 타임아웃 스캔
      poll-interval: 5s
  dem:
    log-lock:
      enabled: true
      cron: "0 0 0 * * *"        # BR-DEM-006 매일 00:00 KST 전일 이전 감리일지 자동 잠금
  outbox:
    relay:
      enabled: true
      poll-interval: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

---
spring:
  config:
    activate:
      on-profile: postgis
  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/fac,classpath:db/migration/hrq,classpath:db/migration/eqp,classpath:db/migration/cst,classpath:db/migration/fcd,classpath:db/migration/sal,classpath:db/migration/rpt,classpath:db/migration/qar,classpath:db/migration/dem,classpath:db/migration-ext
    out-of-order: true   # ext(V1_1, V2_99)는 기본 경로와 버전 대역이 섞이므로 허용

---
# 로컬 개발: Keycloak 없이 헤더 인증 스텁 (X-Actor-Id, X-Roles …). 운영 금지.
spring:
  config:
    activate:
      on-profile: local-noauth
atom:
  security:
    enabled: false
