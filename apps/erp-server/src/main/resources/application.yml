spring:
  application:
    name: atom-erp
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:atom_erp}
    username: ${PG_APP_USER:atom_app}
    password: ${PG_APP_PASSWORD:atom_app_local}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  flyway:
    enabled: true
    schemas: core,fac,hrq,eqp,cst,fcd
    create-schemas: true
    # 모듈별 버전 대역(core V1_x, fac V2_x …). PostGIS 의존 DDL 은 postgis 프로필에서 추가
    locations: classpath:db/migration/core,classpath:db/migration/fac,classpath:db/migration/hrq,classpath:db/migration/eqp,classpath:db/migration/cst,classpath:db/migration/fcd
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 100
  messages:
    basename: messages/core-errors,messages/fac-errors,messages/hrq-errors,messages/eqp-errors,messages/cst-errors,messages/fcd-errors
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: 50MB      # FCD 명세서 업로드 상한(설계 B5.2)
      max-request-size: 51MB
  mvc:
    problemdetails:
      enabled: false   # GlobalProblemHandler 가 대신 처리
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # 자체 outbox 채택, Modulith Event Publication Registry 미사용 (ADR-005)

atom:
  security:
    enabled: true
    issuers:
      - ${KEYCLOAK_URL:http://localhost:8180}/realms/atom-internal
      - ${KEYCLOAK_URL:http://localhost:8180}/realms/atom-portal
  idempotency:
    required-clients: [field-app]
    retention: 24h
    lock-timeout: 30s
  fac:
    due-scan:
      enabled: true
      cron: "0 0 2 * * *"        # 매일 02:00 KST
      thresholds: "180,90,30"
  hrq:
    expiry:
      enabled: true
      cron: "0 0 6 * * *"        # 매일 06:00 KST 만료 스캔
      thresholds: "90,60,30,7"
  eqp:
    calibration-scan:
      enabled: true
      cron: "0 10 0 * * *"       # 매일 00:10 KST — due-soon(D-60/30/7/0) · expired 통합 스캔
      thresholds: "60,30,7,0"
    drone:
      hrq-check: false           # HRQ 조종자 자격 어댑터 연동 전(true 면 Fail-closed 로 비행 등록 보류)
  fcd:
    review:
      k-per-1000: 20        # 월 검토 예산(거래 1,000건당) — 프로토타입 라운드 3 채택값
      min-score: 30
    aip:
      base-url: ${FCD_AIP_URL:}   # Python atomeng_aip.fraud 서비스(비우면 스텁: 맥락 없음 · L3 DISABLED)
      timeout: 800ms
  outbox:
    relay:
      enabled: true
      poll-interval: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

---
spring:
  config:
    activate:
      on-profile: postgis
  flyway:
    locations: classpath:db/migration/core,classpath:db/migration/fac,classpath:db/migration/hrq,classpath:db/migration/eqp,classpath:db/migration/cst,classpath:db/migration/fcd,classpath:db/migration-ext
    out-of-order: true   # ext(V1_1, V2_99)는 기본 경로와 버전 대역이 섞이므로 허용

---
# 로컬 개발: Keycloak 없이 헤더 인증 스텁 (X-Actor-Id, X-Roles …). 운영 금지.
spring:
  config:
    activate:
      on-profile: local-noauth
atom:
  security:
    enabled: false
